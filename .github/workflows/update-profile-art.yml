name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *" # todo dia, ~06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch contributions
        run: python scripts/fetch_contributions.py
      - name: Render README cards
        run: python scripts/render_readme_cards.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile cards [skip ci]"
          file_pattern: "data/contributions.json cards/*.svg"
