<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400" role="img" aria-label="Sobre mim. Desenvolvedor Full Stack Júnior com experiência em React, Next.js e TypeScript no front-end e Node.js e NestJS no back-end, em projetos de e-commerce, PDV e integrações por BFF. Graduando em Ciência da Computação na Unifor, com conclusão prevista para 2027.1.">
