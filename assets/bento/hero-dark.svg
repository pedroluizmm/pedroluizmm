<svg xmlns="http://www.w3.org/2000/svg" width="990" height="300" viewBox="0 0 990 300" role="img" aria-label="Pedro Luiz Mariano — Desenvolvedor de Software. React, Next.js e TypeScript. Fortaleza, Brasil. Graduando em Ciência da Computação na Unifor. Disponível para oportunidades júnior.">
<style>
.card{fill:#14111F;stroke:#2B2448;stroke-width:1.2}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.txt{fill:#EEEBFA} .sec{fill:#A6A0C4} .acc{fill:#A78BFA}
.b{font-weight:600;fill:#EEEBFA}
.chip{fill:#221B3D} .chipt{fill:#CDBFFD}
.ln{opacity:0}.l0{opacity:1}
.c0{transform:translateX(340px)}
@keyframes ln0{0%{opacity:1}29.5%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
@keyframes cv0{0%{transform:translateX(0);animation-timing-function:steps(28,end)}12.4%{transform:translateX(340px)}100%{transform:translateX(340px)}}
.l0{animation:ln0 10.5s linear 0s infinite both}
.c0{animation:cv0 10.5s linear 0s infinite both}
.c1{transform:translateX(424px)}
@keyframes ln1{0%{opacity:1}29.5%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
@keyframes cv1{0%{transform:translateX(0);animation-timing-function:steps(35,end)}12.4%{transform:translateX(424px)}100%{transform:translateX(424px)}}
.l1{animation:ln1 10.5s linear -7.0s infinite both}
.c1{animation:cv1 10.5s linear -7.0s infinite both}
.c2{transform:translateX(532px)}
@keyframes ln2{0%{opacity:1}29.5%{opacity:1}33.3%{opacity:0}100%{opacity:0}}
@keyframes cv2{0%{transform:translateX(0);animation-timing-function:steps(44,end)}12.4%{transform:translateX(532px)}100%{transform:translateX(532px)}}
.l2{animation:ln2 10.5s linear -3.5s infinite both}
.c2{animation:cv2 10.5s linear -3.5s infinite both}
.caret{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.tile.p0,.tile.p1,.tile.p2{animation:pulse 3.6s ease-in-out infinite}
.tile.p1{animation-delay:1.2s}.tile.p2{animation-delay:2.4s}
@keyframes pulse{50%{opacity:.15}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
