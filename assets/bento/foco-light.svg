<svg xmlns="http://www.w3.org/2000/svg" width="390" height="390" viewBox="0 0 390 390" role="img" aria-label="Em foco: arquitetura de software, testes automatizados e fundamentos de cloud. Desenvolvimento de aplicações web e integrações. Interesse em oportunidades como Desenvolvedor Front-end Júnior, Desenvolvedor de Software Júnior e Full Stack Júnior.">
<style>
.card{fill:#F8F6FF;stroke:#E2DCFA;stroke-width:1.2}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.txt{fill:#1D1933} .sec{fill:#57526F} .acc{fill:#6B46D9}
.b{font-weight:600;fill:#1D1933}
.chip{fill:#EDE7FE} .chipt{fill:#4C2A82}
.dot{animation:pulse 2.4s ease-in-out infinite}.d1{animation-delay:.8s}.d2{animation-delay:1.6s}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="6" y="6" width="378" height="378" rx="22" class="card"/>
<text x="36" y="58" class="acc mono" font-size="15">em foco</text>
<circle cx="41" cy="91" r="5" class="dot d0" fill="#6B46D9"/><text x="56" y="96" class="txt mono" font-size="16" font-weight="600">estudando</text>
<text x="56" y="121" class="sec" font-size="15">arquitetura de software</text>
<text x="56" y="142" class="sec" font-size="15">testes automatizados</text>
<text x="56" y="163" class="sec" font-size="15">fundamentos de cloud</text>
<circle cx="41" cy="196" r="5" class="dot d1" fill="#6B46D9"/><text x="56" y="201" class="txt mono" font-size="16" font-weight="600">construindo</text>
<text x="56" y="226" class="sec" font-size="15">aplicações web</text>
<text x="56" y="247" class="sec" font-size="15">integrações</text>
<circle cx="41" cy="280" r="5" class="dot d2" fill="#6B46D9"/><text x="56" y="285" class="txt mono" font-size="16" font-weight="600">aberto a</text>
<text x="56" y="310" class="sec" font-size="15">Desenvolvedor Front-end Júnior</text>
<text x="56" y="331" class="sec" font-size="15">Desenvolvedor de Software Júnior</text>
<text x="56" y="352" class="sec" font-size="15">Full Stack Júnior</text>
</svg>