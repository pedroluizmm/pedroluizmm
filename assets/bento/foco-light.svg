<svg xmlns="http://www.w3.org/2000/svg" width="338" height="400" viewBox="0 0 338 400" role="img" aria-label="Em foco: estudando arquitetura de software, testes automatizados e fundamentos de cloud. Construindo aplicações web full stack e integrações de APIs. Aberto a oportunidades como Desenvolvedor Full Stack Júnior, Desenvolvedor de Software Júnior e Desenvolvedor Front-end Júnior.">
<style>
.card{fill:#F8F6FF;stroke:#E2DCFA;stroke-width:1.2}
text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace}
.txt{fill:#1D1933} .sec{fill:#57526F} .acc{fill:#6B46D9}
.b{font-weight:600;fill:#1D1933}
.chip{fill:#EDE7FE} .chipt{fill:#4C2A82}
.dot{animation:pulse 2.4s ease-in-out infinite}.d1{animation-delay:.8s}.d2{animation-delay:1.6s}
@keyframes pulse{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<rect x="6" y="6" width="326" height="388" rx="22" class="card"/>
<text x="36" y="62" class="acc mono" font-size="16">em foco</text>
<circle cx="41" cy="95" r="5" class="dot d0" fill="#6B46D9"/><text x="56" y="100" class="txt mono" font-size="17" font-weight="600">estudando</text>
<text x="56" y="126" class="sec" font-size="16">arquitetura de software</text>
<text x="56" y="149" class="sec" font-size="16">testes automatizados</text>
<text x="56" y="172" class="sec" font-size="16">fundamentos de cloud</text>
<circle cx="41" cy="203" r="5" class="dot d1" fill="#6B46D9"/><text x="56" y="208" class="txt mono" font-size="17" font-weight="600">construindo</text>
<text x="56" y="234" class="sec" font-size="16">aplicações web full stack</text>
<text x="56" y="257" class="sec" font-size="16">APIs e integrações</text>
<circle cx="41" cy="288" r="5" class="dot d2" fill="#6B46D9"/><text x="56" y="293" class="txt mono" font-size="17" font-weight="600">aberto a</text>
<text x="56" y="319" class="sec" font-size="16">Desenvolvedor Full Stack Júnior</text>
<text x="56" y="342" class="sec" font-size="16">Desenvolvedor de Software Júnior</text>
<text x="56" y="365" class="sec" font-size="16">Desenvolvedor Front-end Júnior</text>
</svg>
